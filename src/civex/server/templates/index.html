{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<div class="grid">
  <a href="/ui/schemas" style="text-decoration:none;">
    <article>
      <h3>{{ schema_count }}</h3>
      <p>Schemas</p>
    </article>
  </a>
  <a href="/ui/datasets" style="text-decoration:none;">
    <article>
      <h3>{{ dataset_count }}</h3>
      <p>Datasets</p>
    </article>
  </a>
  <a href="/ui/workflows" style="text-decoration:none;">
    <article>
      <h3>{{ workflow_count }}</h3>
      <p>Workflows</p>
    </article>
  </a>
  <article>
    <h3>{{ record_count }}</h3>
    <p>Records (total)</p>
  </article>
</div>
{% endblock %}

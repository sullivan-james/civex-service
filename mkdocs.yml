site_name: Civex
site_description: Research data management — schemas, records, files, and workflows.
site_url: https://docs.civex.dev/
repo_url: https://github.com/CivexData/civex-service
repo_name: civex
edit_uri: edit/main/docs/
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - gen-files:
      scripts:              # more populated by C2, D2
        - docs/_gen/plugin_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths: [civex-plugin-sdk/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

exclude_docs: |
  _gen/
  _prose/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first project: getting-started/first-project.md
      - Five-minute tour: getting-started/tour.md
  - Guides:
      - Schemas & fields: guides/schemas-and-fields.md
      - Collections & records: guides/collections-and-records.md
      - Files: guides/files.md
      - Workflows: guides/workflows.md
      - Automation: guides/automation.md
      - Server & web UI: guides/server-and-web-ui.md
      - Remote sync: guides/remote-sync.md
      - PostgreSQL: guides/postgresql.md
      - Logging & telemetry: guides/logging-and-telemetry.md
  - Writing custom plugins: writing-custom-plugins.md
  - Extending:
      - SDK reference: extending/sdk-reference.md
  - Reference:
      - CLI:
          - Plumbing commands: reference/cli/plumbing.md
      - Plugins:
          - Get Field: reference/plugins/get_field.md
          - Save Field: reference/plugins/save_field.md
          - Save Fields: reference/plugins/save_fields.md
          - Load File: reference/plugins/load_file.md
          - Load File List: reference/plugins/load_file_list.md
          - Extract from Filename: reference/plugins/extract_from_filename.md
          - Create Records from Files: reference/plugins/create_records_from_files.md
          - Match Files to Records: reference/plugins/match_files_to_records.md
          - Load CSV: reference/plugins/load_csv.md
          - Rows to Records: reference/plugins/rows_to_records.md
          - Upsert Records: reference/plugins/upsert_records.md

site_name: Civex
site_description: Research data management — schemas, records, files, and workflows.
site_url: https://civexdata.github.io/civex-docs/
# No repo_url/edit_uri: the source repo is private, so a header repo link and an
# "Edit this page" pencil would 404 for every visitor to the public site.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/concepts.css

hooks:
  - docs/_gen/openapi.py

plugins:
  - search
  # Downloads external assets at build time and rewrites references to local
  # copies. Material's mermaid integration otherwise pulls mermaid.min.js from
  # unpkg.com on page load, which would send every visitor to a third-party CDN
  # and break the "site/ works from file:// with no network" property.
  - privacy
  - gen-files:
      scripts:
        - docs/_gen/plugin_reference.py
        - docs/_gen/cli_reference.py
  - neoteroi.mkdocsoad:
      use_pymdownx: true
  - mkdocstrings:
      handlers:
        python:
          paths: [civex-plugin-sdk/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

# Block scalar — every line is a literal gitignore-style pattern. Do not add
# trailing `#` comments here; they become part of the pattern and match nothing.
# contributing/ is maintainer-only: it stays in the repo, never ships to the site.
exclude_docs: |
  _gen/
  _prose/
  contributing/

markdown_extensions:
  - admonition
  - pymdownx.details
  # custom_fences routes ```mermaid blocks to Material's built-in renderer
  # (theme-aware, follows the palette toggle). GitHub renders the same fence
  # natively, so README.md and the docs site share one diagram source.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first project: getting-started/first-project.md
      - Schemas, collections, records: getting-started/concepts.md
      - Five-minute tour: getting-started/tour.md
  - How-to:
      - Import files: how-to/import-data.md
      - Fill fields from file names: how-to/fill-fields-from-filenames.md
      - Put files on another drive: how-to/storage-drives.md
      - Get files out: how-to/export-files.md
      - Sync a project: how-to/set-up-sync.md
      - Undo a mistake: how-to/undo-mistakes.md
      - Back up a project: how-to/back-up.md
      - Cite the data in a paper: how-to/cite-data.md
  - Guides:
      - Data:
          - Schemas & fields: guides/schemas-and-fields.md
          - Collections & records: guides/collections-and-records.md
          - Saved filters: guides/views.md
          - Deleting & restoring: guides/deleting-and-restoring.md
          - Releases: guides/releases.md
      - Files:
          - Files: guides/files.md
          - Storage volumes: guides/storage.md
          - Exports: guides/exports.md
      - Automation:
          - Workflows: guides/workflows.md
          - Runs & automation: guides/automation.md
      - Running civex:
          - Server & web UI: guides/server-and-web-ui.md
          - Hosting civex: guides/hosting.md
          - From Python: guides/python.md
          - Syncing between machines: guides/sync.md
          - PostgreSQL: guides/postgresql.md
          - Logging & telemetry: guides/logging-and-telemetry.md
  - Extending:
      - Writing a plugin: extending/writing-a-plugin.md
      - Container plugins: extending/container-plugins.md
      - Wire protocol: extending/wire-protocol.md
      - SDK reference: extending/sdk-reference.md
  - Reference:
      - HTTP API: reference/http-api.md
      - CLI:
          - Overview: reference/cli/index.md
          - Top-level commands: reference/cli/top-level.md
          - civex ai: reference/cli/ai.md
          - civex auth: reference/cli/auth.md
          - civex automation: reference/cli/automation.md
          - civex bundle: reference/cli/bundle.md
          - civex collection: reference/cli/collection.md
          - civex dashboard: reference/cli/dashboard.md
          - civex db: reference/cli/db.md
          - civex files: reference/cli/files.md
          - civex history: reference/cli/history.md
          - civex logs: reference/cli/logs.md

site_name: Civex
site_description: Research data management — schemas, records, files, and workflows.
site_url: https://docs.civex.dev/
repo_url: https://github.com/CivexData/civex-service
repo_name: civex
edit_uri: edit/main/docs/
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - gen-files:
      scripts: []          # populated by C2, D2, E6

exclude_docs: |
  _gen/
  _prose/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting started: getting-started/install.md
  - Schemas: guides/schemas-and-fields.md
  - Datasets & Records: guides/collections-and-records.md
  - Files: guides/files.md
  - Workflows: guides/workflows.md
  - Plugins: plugins.md
  - Writing custom plugins: writing-custom-plugins.md
  - Server & UI: guides/server-and-web-ui.md
  - Remote sync: guides/remote-sync.md
  - CLI reference: cli-reference.md

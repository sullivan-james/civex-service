name: Parse Selection Table to Unit Selections
description: |
  Triggered when a unit_selection_table (CSV/TSV) is uploaded to a Sequence Selection.
  Parses the table and creates Unit Selection records with all metadata fields
  using built-in field mapping to rename columns.
record_schema: sequence_selection
triggers:
  record_updated:
    schema: sequence_selection
    fields:
      - unit_selection_table
steps:
  - id: parse-table
    plugin: civex.table@1
    config:
      field: unit_selection_table
      delimiter: ','
  - id: create-units
    plugin: civex.save_records@1
    config:
      schema: unit_selection
      if_exists: update
      field_mapping:
        Selection: unit_number
        View: view
        Channel: channel
        Begin Time (s): begin_time_s
        End Time (s): end_time_s
        Low Freq (Hz): low_freq_hz
        High Freq (Hz): high_freq_hz
        Delta Time (s): delta_time_s
        Delta Freq (Hz): delta_freq_hz
        Avg Power Density (dB FS/Hz): avg_power_db
        Annotation: annotation
        Contoured: contoured
    inputs:
      rows: parse-table.table

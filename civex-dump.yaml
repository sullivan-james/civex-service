workflows:
- filename: load-contour-files.yaml
  content: "name: load-contour-files\ndescription: Match uploaded contour files to\
    \ Selection records by filename, then trigger stat calculation.\nrecord_schema:\
    \ Recording\n\ninputs:\n  files:\n    type: files\n    label: Contour files\n\
    \    description: >\n      Raven contour CSV files. Each filename must contain\
    \ the selection number\n      as a capture group matched by the pattern in the\
    \ match step (default: sel_(\\d+)).\n\nsteps:\n  - id: match\n    plugin: civex.match_files_to_records\n\
    \    config:\n      schema: Selection\n      key_field: selection_number\n   \
    \   file_field: contour_file\n      pattern: 'sel_(\\d+)'\n    inputs:\n     \
    \ files: __input__.files\n"
- filename: process-contour-file.yaml
  content: "name: process-contour-file\ndescription: Load a contour file from a Selection\
    \ record and calculate contour statistics.\nrecord_schema: Selection\n\ntriggers:\n\
    \  record_updated:\n    schema: Selection\n    fields:\n      - contour_file\n\
    \nsteps:\n  - id: load_bytes\n    plugin: civex.load_file\n    config:\n     \
    \ field: contour_file\n\n  - id: parse_csv\n    plugin: civex.load_csv\n    config:\n\
    \      delimiter: \",\"\n    inputs:\n      bytes: load_bytes.bytes\n\n  - id:\
    \ calculate_stats\n    plugin: project.calculate_contour_stats\n    inputs:\n\
    \      table: parse_csv.table\n\n  - id: save_stats\n    plugin: civex.save_fields\n\
    \    inputs:\n      updates: calculate_stats.updates\n"
- filename: unpack-selection-table.yaml
  content: "name: unpack-selection-table\ndescription: Parse a Raven selection table\
    \ file on a Recording record and upsert Selection records.\nrecord_schema: Recording\n\
    \ntriggers:\n  record_created:\n    schema: Recording\n  record_updated:\n   \
    \ schema: Recording\n    fields:\n      - selection_table_file\n\nsteps:\n  -\
    \ id: load_bytes\n    plugin: civex.load_file\n    config:\n      field: selection_table_file\n\
    \n  - id: parse_csv\n    plugin: civex.load_csv\n    config:\n      delimiter:\
    \ \",\"\n    inputs:\n      bytes: load_bytes.bytes\n\n  - id: parse_table\n \
    \   plugin: project.parse_selection_table\n    inputs:\n      table: parse_csv.table\n\
    \n  - id: upsert_selections\n    plugin: civex.upsert_records\n    config:\n \
    \     schema: Selection\n      key_field: selection_number\n    inputs:\n    \
    \  table: parse_table.table\n"
plugins:
- filename: calculate_contour_stats.py
  content: "from __future__ import annotations\n\nfrom enum import Enum\nfrom typing\
    \ import Any\n\nimport numpy as np\nimport pandas as pd\nfrom pydantic import\
    \ BaseModel\n\nfrom civex.plugins.base import BasePlugin, WorkflowContext\n\n\n\
    class _Sweep(Enum):\n    DOWN = 0\n    FLAT = 1\n    UP   = 2\n\n\nclass _Step(Enum):\n\
    \    DOWN = 0\n    FLAT = 1\n    UP   = 2\n\n\ndef _round_nearest(num: float)\
    \ -> int:\n    return int(num) if num % 1 < 0.5 else int(num) + 1\n\n\ndef _calculate(df:\
    \ pd.DataFrame) -> dict[str, Any]:\n    df = df.rename(columns=lambda c: c.strip())\n\
    \n    required = (\"Time [ms]\", \"Peak Frequency [Hz]\", \"Duty Cycle\", \"Energy\"\
    , \"WindowRMS\")\n    missing = [c for c in required if c not in df.columns]\n\
    \    if missing:\n        raise ValueError(f\"Missing required contour columns:\
    \ {', '.join(missing)}\")\n\n    df = df.sort_values(\"Time [ms]\").reset_index(drop=True)\n\
    \    times = df[\"Time [ms]\"].tolist()\n    freqs = df[\"Peak Frequency [Hz]\"\
    ].tolist()\n    duties = df[\"Duty Cycle\"].tolist()\n    n = len(df)\n\n    #\
    \ ── slopes ──────────────────────────────────────────────────────────────\n \
    \   slopes = [0.0] * n\n    slope_sum = slope_abs_sum = 0.0\n    slope_pos_sum\
    \ = slope_neg_sum = 0.0\n    slope_pos_count = slope_neg_count = 0\n\n    for\
    \ i in range(1, n):\n        dt = times[i] - times[i - 1]\n        df_ = freqs[i]\
    \ - freqs[i - 1]\n        if dt > 0:\n            s = df_ / dt\n            slopes[i]\
    \ = s\n            slope_sum += s\n            slope_abs_sum += abs(s)\n     \
    \       if s > 0:\n                slope_pos_sum += s\n                slope_pos_count\
    \ += 1\n            elif s < 0:\n                slope_neg_sum += s\n        \
    \        slope_neg_count += 1\n\n    # ── sweeps & steps ──────────────────────────────────────────────────────\n\
    \    steps  = [_Step.FLAT]  * n\n    sweeps = [None]        * n\n    step_sensitivity\
    \ = 11\n\n    freq_stepup = freq_stepdown = 0\n    sweep_up = sweep_down = sweep_flat\
    \ = 0\n    num_sweeps_up_down = num_sweeps_down_up = 0\n    num_sweeps_down_flat\
    \ = num_sweeps_flat_down = 0\n    num_sweeps_flat_up  = num_sweeps_up_flat  =\
    \ 0\n\n    last_sweep = _Sweep.FLAT\n\n    dc_quarter_sums   = [0.0, 0.0, 0.0,\
    \ 0.0]\n    dc_quarter_counts = [0,   0,   0,   0  ]\n\n    direction: _Sweep\
    \ | None = None\n    num_inflections = 0\n    inflection_times: list[float] =\
    \ []\n\n    for i in range(n):\n        # duty-cycle quarters\n        q = 0 if\
    \ i < n // 4 else 1 if i < n // 2 else 2 if i < 3 * n // 4 else 3\n        dc_quarter_sums[q]\
    \   += duties[i]\n        dc_quarter_counts[q] += 1\n\n        # steps\n     \
    \   if i >= 1:\n            if (steps[i - 1] == _Step.FLAT and\n             \
    \       freqs[i] >= freqs[i - 1] * (1 + step_sensitivity / 100)):\n          \
    \      steps[i] = _Step.UP\n                freq_stepup += 1\n            elif\
    \ (steps[i - 1] == _Step.FLAT and\n                    freqs[i] <= freqs[i - 1]\
    \ * (1 - step_sensitivity / 100)):\n                steps[i] = _Step.DOWN\n  \
    \              freq_stepdown += 1\n            else:\n                steps[i]\
    \ = _Step.FLAT\n\n        # sweeps (interior points only)\n        if 0 < i <\
    \ n - 1:\n            p, c_, nx = freqs[i - 1], freqs[i], freqs[i + 1]\n     \
    \       if p <= c_ <= nx:\n                sweep_up += 1\n                last_sweep\
    \ = _Sweep.UP\n            if p >= c_ >= nx:\n                sweep_down += 1\n\
    \                last_sweep = _Sweep.DOWN\n            if p == c_ == nx:\n   \
    \             sweep_flat += 1\n                last_sweep = _Sweep.FLAT\n    \
    \        sweeps[i] = last_sweep\n\n        # legacy: last element is always DOWN\n\
    \        if i == n - 1:\n            sweeps[i] = _Sweep.DOWN\n\n        # sweep-pair\
    \ counters\n        if i > 1:\n            curr = sweeps[i]\n            prev\
    \ = sweeps[i - 1]\n            if   prev == _Sweep.UP   and curr == _Sweep.DOWN:\
    \  num_sweeps_up_down   += 1\n            elif prev == _Sweep.DOWN and curr ==\
    \ _Sweep.UP:    num_sweeps_down_up   += 1\n            elif prev == _Sweep.DOWN\
    \ and curr == _Sweep.FLAT:  num_sweeps_down_flat += 1\n            elif prev ==\
    \ _Sweep.FLAT and curr == _Sweep.DOWN:  num_sweeps_flat_down += 1\n          \
    \  elif prev == _Sweep.FLAT and curr == _Sweep.UP:    num_sweeps_flat_up   +=\
    \ 1\n            elif prev == _Sweep.UP   and curr == _Sweep.FLAT:  num_sweeps_up_flat\
    \   += 1\n\n        # inflections\n        if i == 1:\n            direction =\
    \ sweeps[1]\n        elif i > 1:\n            curr_sweep = _Sweep.DOWN if i ==\
    \ n - 1 else sweeps[i]  # legacy bug preserved\n            if direction in (_Sweep.UP,\
    \ _Sweep.DOWN):\n                if ((curr_sweep == _Sweep.UP   and direction\
    \ == _Sweep.DOWN) or\n                        (curr_sweep == _Sweep.DOWN and direction\
    \ == _Sweep.UP)):\n                    direction = curr_sweep\n              \
    \      num_inflections += 1\n                    inflection_times.append(times[i])\n\
    \            elif direction == _Sweep.FLAT:\n                direction = curr_sweep\n\
    \n    # ── assemble results ────────────────────────────────────────────────────\n\
    \    duration = (times[-1] - times[0]) / 1000\n\n    # inflection delta stats\n\
    \    if num_inflections > 1:\n        deltas = sorted([(inflection_times[k] -\
    \ inflection_times[k - 1]) / 1000\n                         for k in range(1,\
    \ len(inflection_times))])\n        inf_max    = deltas[-1]\n        inf_min \
    \   = deltas[0]\n        inf_maxmin = inf_max / inf_min if inf_min != 0 else 0.0\n\
    \        inf_mean   = sum(deltas) / len(deltas)\n        inf_std    = float(pd.Series(deltas).std())\
    \ if len(deltas) > 1 else 0.0\n        inf_med    = float(pd.Series(deltas).median())\n\
    \        inf_dur    = num_inflections / duration\n    else:\n        inf_max =\
    \ inf_min = inf_maxmin = inf_mean = inf_std = inf_med = inf_dur = 0.0\n\n    #\
    \ sweep percentages\n    sweep_total = sweep_up + sweep_down + sweep_flat\n  \
    \  sweep_up_pct   = (sweep_up   / sweep_total) * 100 if sweep_total else 0.0\n\
    \    sweep_down_pct = (sweep_down / sweep_total) * 100 if sweep_total else 0.0\n\
    \    sweep_flat_pct = (sweep_flat / sweep_total) * 100 if sweep_total else 0.0\n\
    \n    # slope summaries\n    freq_posslopemean = (slope_pos_sum / slope_pos_count)\
    \ * 1000 if slope_pos_count else 0.0\n    freq_negslopemean = (slope_neg_sum /\
    \ slope_neg_count) * 1000 if slope_neg_count else 0.0\n    freq_sloperatio   =\
    \ freq_posslopemean / freq_negslopemean if freq_negslopemean != 0 else 0.0\n \
    \   freq_slopemean    = (slope_sum     / (n - 1)) * 1000 if n > 1 else 0.0\n \
    \   freq_absslopemean = (slope_abs_sum / (n - 1)) * 1000 if n > 1 else 0.0\n\n\
    \    # beg/end sweeps (need at least 4 points)\n    if n >= 4:\n        beg_avg\
    \ = (slopes[1] + slopes[2] + slopes[3]) / 3\n        end_avg = (slopes[-4] + slopes[-3]\
    \ + slopes[-2]) / 3\n    else:\n        beg_avg = end_avg = 0.0\n\n    def _sweep_flags(avg:\
    \ float) -> tuple[int, bool, bool]:\n        if avg > 0:   return _Sweep.UP.value,\
    \   True,  False\n        elif avg < 0: return _Sweep.DOWN.value,  False, True\n\
    \        else:          return _Sweep.FLAT.value,  False, False\n\n    freq_begsweep,\
    \ freq_begup, freq_begdown = _sweep_flags(beg_avg)\n    freq_endsweep, freq_endup,\
    \ freq_enddown = _sweep_flags(end_avg)\n\n    freq_s = pd.Series(freqs)\n    dc_s\
    \   = pd.Series(duties)\n\n    freq_max     = freq_s.max()\n    freq_min_val =\
    \ freq_s.min()\n    freq_range   = freq_max - freq_min_val\n    freq_center  =\
    \ (freq_max + freq_min_val) / 2\n    freq_median  = float(freq_s.median())\n \
    \   freq_mean    = float(freq_s.mean())\n    freq_std     = float(freq_s.std())\n\
    \    freq_relbw   = freq_range / freq_center if freq_center else 0.0\n    freq_mmratio\
    \ = freq_max / freq_min_val  if freq_min_val else 0.0\n    freq_begin   = freqs[0]\n\
    \    freq_end_val = freqs[-1]\n    freq_begratio = freq_begin / freq_end_val if\
    \ freq_end_val else 0.0\n    freq_q1      = freqs[_round_nearest(n / 4) - 1]\n\
    \    freq_q2      = freqs[_round_nearest(n / 2) - 1]\n    freq_q3      = freqs[_round_nearest(3\
    \ * n / 4) - 1]\n    freq_spread  = float(freq_s.quantile(0.75) - freq_s.quantile(0.25))\n\
    \n    freq_cofm = 0.0\n    for i in range(6, n, 3):\n        freq_cofm += abs(freqs[i]\
    \ - freqs[i - 3])\n    freq_cofm /= 10000\n\n    dc_qmeans = [\n        dc_quarter_sums[q]\
    \ / dc_quarter_counts[q] if dc_quarter_counts[q] else 0.0\n        for q in range(4)\n\
    \    ]\n\n    return {\n        \"duration\":                        duration,\n\
    \        \"num_inflections\":                 num_inflections,\n        \"inflection_maxdelta\"\
    :             inf_max,\n        \"inflection_mindelta\":             inf_min,\n\
    \        \"inflection_maxmindelta\":          inf_maxmin,\n        \"inflection_meandelta\"\
    :            inf_mean,\n        \"inflection_standarddeviationdelta\": inf_std,\n\
    \        \"inflection_mediandelta\":          inf_med,\n        \"inflection_duration\"\
    :             inf_dur,\n        \"freq_sweepuppercent\":             sweep_up_pct,\n\
    \        \"freq_sweepdownpercent\":           sweep_down_pct,\n        \"freq_sweepflatpercent\"\
    :           sweep_flat_pct,\n        \"num_sweepsupdown\":                num_sweeps_up_down,\n\
    \        \"num_sweepsdownup\":                num_sweeps_down_up,\n        \"\
    num_sweepsdownflat\":              num_sweeps_down_flat,\n        \"num_sweepsflatdown\"\
    :              num_sweeps_flat_down,\n        \"num_sweepsflatup\":          \
    \      num_sweeps_flat_up,\n        \"num_sweepsupflat\":                num_sweeps_up_flat,\n\
    \        \"freq_sloperatio\":                 freq_sloperatio,\n        \"freq_slopemean\"\
    :                  freq_slopemean,\n        \"freq_posslopemean\":           \
    \    freq_posslopemean,\n        \"freq_negslopemean\":               freq_negslopemean,\n\
    \        \"freq_absslopemean\":               freq_absslopemean,\n        \"freq_begsweep\"\
    :                   freq_begsweep,\n        \"freq_begup\":                  \
    \    freq_begup,\n        \"freq_begdown\":                    freq_begdown,\n\
    \        \"freq_endsweep\":                   freq_endsweep,\n        \"freq_endup\"\
    :                      freq_endup,\n        \"freq_enddown\":                \
    \    freq_enddown,\n        \"dc_mean\":                         float(dc_s.mean()),\n\
    \        \"dc_standarddeviation\":            float(dc_s.std()),\n        \"dc_quarter1mean\"\
    :                 dc_qmeans[0],\n        \"dc_quarter2mean\":                \
    \ dc_qmeans[1],\n        \"dc_quarter3mean\":                 dc_qmeans[2],\n\
    \        \"dc_quarter4mean\":                 dc_qmeans[3],\n        \"freq_max\"\
    :                        freq_max,\n        \"freq_min\":                    \
    \    freq_min_val,\n        \"freq_range\":                      freq_range,\n\
    \        \"freq_median\":                     freq_median,\n        \"freq_center\"\
    :                     freq_center,\n        \"freq_relbw\":                  \
    \    freq_relbw,\n        \"freq_maxminratio\":                freq_mmratio,\n\
    \        \"freq_begin\":                      freq_begin,\n        \"freq_end\"\
    :                        freq_end_val,\n        \"freq_begendratio\":        \
    \        freq_begratio,\n        \"freq_mean\":                       freq_mean,\n\
    \        \"freq_standarddeviation\":          freq_std,\n        \"freq_quarter1\"\
    :                   freq_q1,\n        \"freq_quarter2\":                   freq_q2,\n\
    \        \"freq_quarter3\":                   freq_q3,\n        \"freq_spread\"\
    :                     freq_spread,\n        \"freq_numsteps\":               \
    \    freq_stepup + freq_stepdown,\n        \"freq_stepup\":                  \
    \   freq_stepup,\n        \"freq_stepdown\":                   freq_stepdown,\n\
    \        \"step_duration\":                   (freq_stepup + freq_stepdown) /\
    \ duration if duration else 0.0,\n        \"freq_cofm\":                     \
    \  freq_cofm,\n    }\n\n\nclass Plugin(BasePlugin):\n    id = \"project.calculate_contour_stats\"\
    \n    name = \"Calculate Contour Stats\"\n    description = \"Compute Raven contour\
    \ statistics from a contour CSV table.\"\n    category = \"transforms\"\n\n  \
    \  class Config(BaseModel):\n        pass\n\n    def run(self, inputs: dict[str,\
    \ Any], config: Config, ctx: WorkflowContext) -> dict[str, Any]:\n        table:\
    \ pd.DataFrame = inputs[\"table\"]\n        updates = _calculate(table)\n    \
    \    return {\"updates\": updates}\n"
- filename: parse_selection_table.py
  content: "from __future__ import annotations\n\nfrom typing import Any\n\nfrom pydantic\
    \ import BaseModel\n\nfrom civex.plugins.base import BasePlugin, WorkflowContext\n\
    \n\ndef _coerce_annotation(value: Any) -> str:\n    if isinstance(value, str):\n\
    \        a = value.upper().strip()\n        if a == \"Y\" or a.startswith(\"Y\"\
    ):\n            return \"Y\"\n        elif a == \"N\" or a.startswith(\"N\"):\n\
    \            return \"N\"\n    return \"M\"\n\n\nclass Plugin(BasePlugin):\n \
    \   id = \"project.parse_selection_table\"\n    name = \"Parse Selection Table\"\
    \n    description = \"Map a Raven selection table CSV to Selection record rows\
    \ ready for civex.upsert_records.\"\n    category = \"transforms\"\n\n    class\
    \ Config(BaseModel):\n        coerce_annotations: bool = True\n\n    def run(self,\
    \ inputs: dict[str, Any], config: Config, ctx: WorkflowContext) -> dict[str, Any]:\n\
    \        try:\n            import pandas as pd\n        except ImportError:\n\
    \            raise ImportError(\"project.parse_selection_table requires pandas\"\
    )\n\n        df: pd.DataFrame = inputs[\"table\"]\n        df = df.rename(columns=lambda\
    \ c: c.strip())\n\n        required = (\"Selection\", \"View\", \"Channel\", \"\
    Begin Time (s)\", \"End Time (s)\",\n                    \"Low Freq (Hz)\", \"\
    High Freq (Hz)\", \"Annotation\")\n        missing = [c for c in required if c\

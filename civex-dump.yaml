workflows:
- filename: process-contour-file.yaml
  content: "name: process-contour-file\ndescription: Load a contour file from a Selection\
    \ record and calculate contour statistics.\n\ntriggers:\n  record_updated:\n \
    \   schema: Selection\n    fields:\n      - contour_file\n\nsteps:\n  - id: load_bytes\n\
    \    plugin: civex.load_file\n    config:\n      field: contour_file\n\n  - id:\
    \ parse_csv\n    plugin: civex.load_csv\n    config:\n      delimiter: \",\"\n\
    \    inputs:\n      bytes: load_bytes.bytes\n\n  - id: calculate_stats\n    plugin:\
    \ project.calculate_contour_stats\n    inputs:\n      table: parse_csv.table\n\
    \n  - id: save_stats\n    plugin: civex.save_fields\n    inputs:\n      updates:\
    \ calculate_stats.updates\n"
- filename: unpack-selection-table.yaml
  content: "name: unpack-selection-table\ndescription: Parse a Raven selection table\
    \ file on a Recording record and upsert Selection records.\n\ntriggers:\n  record_created:\n\
    \    schema: Recording\n  record_updated:\n    schema: Recording\n    fields:\n\
    \      - selection_table_file\n\nsteps:\n  - id: load_bytes\n    plugin: civex.load_file\n\
    \    config:\n      field: selection_table_file\n\n  - id: parse_csv\n    plugin:\
    \ civex.load_csv\n    config:\n      delimiter: \",\"\n    inputs:\n      bytes:\
    \ load_bytes.bytes\n\n  - id: parse_table\n    plugin: project.parse_selection_table\n\
    \    inputs:\n      table: parse_csv.table\n\n  - id: upsert_selections\n    plugin:\
    \ civex.upsert_records\n    config:\n      schema: Selection\n      key_field:\
    \ selection_number\n    inputs:\n      table: parse_table.table\n"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Where the app is served: a host serving it under a path of its own
         writes that path here (civex/server/app_page.py), and every asset,
         request and route follows it (src/utils/host.ts). -->
    <base href="/" />
    <title>civex</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before React mounts so the correct theme paints on first
      // frame instead of flashing light then swapping to a stored dark
      // preference.
      ;(function () {
        var pref = localStorage.getItem('civex-theme')
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.setAttribute('data-theme', pref)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

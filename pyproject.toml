[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civex"
version = "0.0.3"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
civex = "civex.main:app"
civex-desktop = "civex.desktop.tray:main"

[project.optional-dependencies]
postgres  = ["psycopg2-binary>=2.9"]
workflows = ["pandas>=2.0"]
server    = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]
desktop   = ["pywebview>=5.0"]
dev       = ["pytest>=8", "httpx2>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civex = ["server/static/**"]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "civex"
dynamic = ["version"]
description = "Local-first research data management — schemas, records, files, and workflow automation in one place"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "James Sullivan", email = "sullivanj041@gmail.com" }]
keywords = ["research", "data", "management", "cli", "workflows", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Validates a workflow step's `config` against the JSON Schema its plugin
    # declared in `describe` (CIVEX-142). A base dependency rather than an
    # extra because workflow save/run validation is core, and it has to
    # validate a schema that came from an arbitrary out-of-process plugin --
    # not somewhere to hand-roll a subset of the spec.
    "jsonschema>=4.0",
    # `civex update` compares the installed version against PyPI's.
    "packaging>=23",
    # Sync's device keys (Ed25519): a device signs in with a key that never
    # leaves it, so nothing reusable crosses the network. The standard library
    # has no Ed25519.
    "cryptography>=42; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel Macs: cryptography 49 stopped publishing Intel macOS wheels, so
    # newer versions only install there by compiling Rust. 48 is the last
    # with one. Widen this if a later version ships Intel wheels again.
    "cryptography>=42,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # HTTPS that trusts what the operating system trusts (civex/tls.py):
    # Python's own default has no certificates on some installs (python.org
    # on macOS), so a device couldn't reach a server every browser accepts.
    "truststore>=0.10",
    # The plugin SDK is its own published project (MIT, versioned from `sdk-v*` git tags --
    # see docs/contributing/sdk-release.md). This range must admit the newest
    # `sdk-v*` tag: scripts/check_sdk_sync.py enforces that in CI, and the
    # civex release refuses to publish unless that SDK version is already on
    # PyPI and the SDK's source hasn't changed since it. Widen the upper bound (minor bump)
    # deliberately when a compatible SDK ships; narrow the lower bound only
    # if civex starts needing a newer SDK.
    "civex-plugin-sdk>=0.2.0,<0.3",
    # Everything below used to be an optional extra. The whole set is small
    # enough that a plain `pipx install civex` should just work, so they're
    # base dependencies now (the extras further down remain as empty aliases
    # so `pip install "civex[server]"` and existing pipx installs keep
    # resolving).
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "openai>=1.0",
    "sentry-sdk>=2.0",
    "tzdata>=2024.1",
    "openpyxl>=3.1.5",
]

[project.urls]
Documentation = "https://civexdata.github.io/civex-docs/"

[project.scripts]
civex = "civex.main:app"
civex-desktop = "civex.desktop.tray:main"

[project.optional-dependencies]
# pywebview stays optional: it pulls platform-specific GUI packages (pyobjc on
# macOS, pythonnet on Windows) that a server-only install shouldn't need.
desktop   = ["pywebview>=5.0"]
# Empty aliases kept for back-compat: these dependencies are now installed by
# default (see `dependencies` above).
postgres  = []
workflows = []
server    = []
ai        = []
telemetry = []
dev       = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3", "httpx2>=0.28", "pre-commit>=3.7", "ruff>=0.15", "mypy>=2.0", "pip-audit>=2.7"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-gen-files>=0.5",
  "mkdocstrings[python]>=0.26",
  "neoteroi-mkdocs>=1.1",
]

[tool.setuptools_scm]
# Only `v*` tags version civex. `sdk-v*` tags belong to civex-plugin-sdk (its
# own pyproject.toml); setuptools-scm's default tag pattern would otherwise
# accept them, because it tolerates a word prefix.
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*(?:[.-]?(?:a|b|rc|post|dev)\\d+)*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.uv.workspace]
members = ["civex-plugin-sdk"]

[tool.uv.sources]
civex-plugin-sdk = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civex = ["server/static/**", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "os_sensitive: touches the real OS (files, paths, processes, mounts, the launcher); the only tests run on Windows and macOS in CI. Applied by file name in tests/conftest.py.",
    "posix_only: needs POSIX permissions, signals or process groups",
    "windows_only: needs Windows APIs",
    "macos_only: needs macOS behaviour",
]

[tool.coverage.run]
source = ["civex"]
branch = true

[tool.coverage.report]
fail_under = 34
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build", "dist", "frontend"]

[tool.ruff.lint]
# Matches ruff's own defaults today (E4, E7, E9, F). Kept explicit so the
# rule set is visible and intentional, rather than "whatever ruff defaults
# to this release." src/ has pre-existing violations against a broader
# select (B, UP, I, ...); widen this only alongside a cleanup pass.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
error_summary = false

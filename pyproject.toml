[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "civex"
dynamic = ["version"]
description = "Local-first research data management — schemas, records, files, and workflow automation in one place"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "James Sullivan", email = "sullivanj041@gmail.com" }]
keywords = ["research", "data", "management", "cli", "workflows", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.scripts]
civex = "civex.main:app"
civex-desktop = "civex.desktop.tray:main"

[project.optional-dependencies]
postgres  = ["psycopg2-binary>=2.9"]
workflows = ["pandas>=2.0"]
server    = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]
desktop   = ["pywebview>=5.0"]
ai        = ["anthropic>=0.40", "openai>=1.0"]
telemetry = ["sentry-sdk>=2.0"]
dev       = ["pytest>=8", "pytest-cov>=5", "httpx2>=0.28", "pre-commit>=3.7", "ruff>=0.15", "mypy>=2.0"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civex = ["server/static/**", "db/migrations/script.py.mako"]

[tool.coverage.run]
source = ["civex"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build", "dist", "frontend"]

[tool.ruff.lint]
# Matches ruff's own defaults today (E4, E7, E9, F). Kept explicit so the
# rule set is visible and intentional, rather than "whatever ruff defaults
# to this release." src/ has pre-existing violations against a broader
# select (B, UP, I, ...); widen this only alongside a cleanup pass.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
error_summary = false

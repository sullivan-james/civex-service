[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "civex"
dynamic = ["version"]
description = "Local-first research data management — schemas, records, files, and workflow automation in one place"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "James Sullivan", email = "sullivanj041@gmail.com" }]
keywords = ["research", "data", "management", "cli", "workflows", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
civex = "civex.main:app"
civex-desktop = "civex.desktop.tray:main"

[project.optional-dependencies]
postgres  = ["psycopg2-binary>=2.9"]
workflows = ["pandas>=2.0"]
server    = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]
desktop   = ["pywebview>=5.0"]
dev       = ["pytest>=8", "httpx2>=0.28"]

[project.urls]
Homepage = "https://github.com/sullivan-james/civex"
Documentation = "https://github.com/sullivan-james/civex/wiki"
"Bug Tracker" = "https://github.com/sullivan-james/civex/issues"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civex = ["server/static/**"]

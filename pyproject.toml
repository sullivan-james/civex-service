[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
civex = "civex.main:app"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
workflows = ["pandas>=2.0"]
server = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civex = ["server/static/**"]

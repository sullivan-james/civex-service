name: Cross-platform

# The full suite runs on Linux (ci.yml). macOS and Windows runners cost several
# times as much, and most tests are plain Python that behaves the same
# everywhere, so here only the tests marked `os_sensitive` run (see
# tests/conftest.py): the ones that touch real files, paths, processes, mounts
# or the launcher.
#
#   Windows: PRs that touch OS-sensitive code (not draft ones), nightly, tags,
#            on demand.
#   macOS:   nightly, tags, on demand only. It bills at ten times the Linux
#            rate (Windows two), and what it catches that Linux and Windows
#            don't is rare, so a PR doesn't pay for it: the nightly run does.
#   `tests/**` is not a trigger: only conftest.py, which is where a test file is
#   marked OS-sensitive, so a PR that adds or moves one still runs. An edit to an
#   existing OS-sensitive test alone waits for the nightly run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/civex/fs_locations.py"
      - "src/civex/launcher.py"
      - "src/civex/processes.py"
      - "src/civex/config.py"
      - "src/civex/project.py"
      - "src/civex/repositories/local/file_store.py"
      - "src/civex/services/store_service.py"
      - "src/civex/services/transfer*.py"
      - "src/civex/services/db_move_service.py"
      - "src/civex/plugins/**"
      - "src/civex/desktop/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cross-platform.yml"
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  os-sensitive-tests:
    name: os_sensitive tests (${{ matrix.os }})
    # A draft PR waits until it is ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # macOS only when nothing is waiting on the answer (see the top).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads tags

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - name: Run OS-sensitive tests
        run: uv run pytest -m os_sensitive -q -n auto -p no:cacheprovider --durations=15

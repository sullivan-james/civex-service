name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --extra server --extra docs

      - name: Build docs
        env: { CIVEX_LOG_LEVEL: WARNING }
        # The `privacy` plugin fetches third-party assets (mermaid.js, Google Fonts)
        # at build time so the site never calls out to a third-party CDN at page
        # load. Those fetches occasionally 404 transiently (e.g. Google rotating a
        # font subset's hash) with no fault in our docs content, so retry the whole
        # build a couple of times before failing the job.
        run: |
          for attempt in 1 2 3; do
            uv run mkdocs build --strict && exit 0
            echo "mkdocs build failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      - uses: actions/upload-artifact@v7
        with: { name: docs-site, path: site/ }

      # Force-pushes the built site to the public CivexData/civex-docs mirror, which
      # GitHub Pages serves. This repo is private, so Pages cannot serve it directly
      # without a paid plan — the mirror holds generated HTML only, never source.
      - name: Publish to docs mirror
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # No `secrets.X != ''` guard here on purpose: the previous rsync publish step
          # was gated that way, the secret was never set, and it no-opped silently for
          # months. A missing token must fail this job loudly.
          test -n "${DOCS_PUSH_TOKEN:?DOCS_PUSH_TOKEN is not set — see docs/contributing/publishing-docs.md}"
          cd site
          # Pages runs Jekyll by default, which silently drops paths containing
          # underscores — without this, Material's assets/ tree 404s and the site
          # renders unstyled.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "civex-docs-bot"
          git config user.email "noreply@civex.dev"
          git add -A
          # Deliberately no ${GITHUB_SHA}: that would publish this private repo's
          # commit SHAs into a public repo's permanent history.
          git commit -qm "Docs build"
          # Fresh history each run keeps the mirror from growing without bound and
          # guarantees deleted pages actually disappear.
          git push -q --force \
            "https://x-access-token:${DOCS_PUSH_TOKEN}@github.com/CivexData/civex-docs.git" \
            gh-pages
        env:
          DOCS_PUSH_TOKEN: ${{ secrets.DOCS_PUSH_TOKEN }}

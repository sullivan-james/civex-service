name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG entry exists for this tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! grep -qE "^## ${TAG}([[:space:]]|\$)" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for ${TAG}. Add a '## ${TAG} — <label> (YYYY-MM-DD)' section before pushing this tag (see PRODUCTION_READINESS.md §4a)."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into package
        run: cp -r frontend/dist/. src/civex/server/static/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bundle civex-plugin-sdk wheel
        # civex-plugin-sdk isn't published to PyPI -- ship a prebuilt wheel
        # as civex package data so the subprocess plugin runtime can resolve
        # it locally (see docs/contributing/release.md and
        # subprocess_runtime.py's _bundled_sdk_wheel_dir()).
        run: uv build --wheel -o src/civex/_vendor/sdk civex-plugin-sdk

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

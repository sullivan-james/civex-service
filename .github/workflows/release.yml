name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: every build and test, on any branch, and nothing published.
  workflow_dispatch:

# Build the wheel once, install that exact file on every OS and run it (and
# the desktop app, installing it), and only then publish: a PyPI version can
# never be uploaded again, even after it is deleted, and tests from a checkout
# can't see what the wheel is missing.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # A final release needs its own `## vX.Y.Z` entry; a pre-release
      # (vX.Y.ZrcN, bN, aN, .devN) may use that heading or `## Unreleased`.
      - name: Check the tag and its CHANGELOG entry
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --no-project --with packaging python scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into package
        run: cp -r frontend/dist/. src/civex/server/static/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the SDK civex depends on is published
        # civex declares civex-plugin-sdk as a normal dependency, so the
        # in-repo SDK version must already be on PyPI or `pip install civex`
        # can't resolve it (the v1.0.5 failure). Push the sdk-v* tag first.
        run: |
          uv run --no-project --with packaging python scripts/check_sdk_sync.py check
          uv run --no-project --with packaging python scripts/check_sdk_sync.py require-published

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Check the wheel is the tag's version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --no-project --with packaging python scripts/check_release_tag.py "$GITHUB_REF_NAME" --wheel-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist

      # As the install guide says, with no Python set up: uv fetches one.
      - name: Install the wheel the way a person would
        shell: bash
        run: uv tool install dist/*.whl

      - name: Run it
        shell: bash
        run: |
          civex="$(uv tool dir --bin)/civex$([ "$RUNNER_OS" = Windows ] && echo .exe)"
          uv run --no-project python scripts/smoke_civex.py "$civex" \
            --expect-version "${{ needs.build.outputs.version }}"

  # The desktop app is a small launcher carrying uv (desktop-launcher/): it
  # installs civex[desktop] on first start and updates it with uv. Build it,
  # then run it as a person's first start would, against the tested wheel.
  desktop:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: civex-linux.tar.gz
          - os: macos-latest
            asset: civex-macos.dmg
          - os: windows-latest
            asset: civex-windows.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The uv bundled into the app.
      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist

      - name: Build the app
        shell: bash
        run: |
          pip install pyinstaller
          CIVEX_LAUNCHER_UV="$(command -v uv)" pyinstaller desktop-launcher/launcher.spec \
            --distpath app-dist --workpath app-build

      - name: Run it as a first start would, then use the civex it installed
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   app=app-dist/civex.app/Contents/MacOS/civex ;;
            Windows) app=app-dist/civex.exe ;;
            *)       app=app-dist/civex ;;
          esac
          wheel="$(ls "$PWD"/dist/*.whl)"
          [ "$RUNNER_OS" = Windows ] && wheel="$(cygpath -m "$wheel")"
          home="$RUNNER_TEMP/civex-app"
          CIVEX_APP_HOME="$home" \
            CIVEX_LAUNCHER_SOURCE="civex[desktop] @ file:///${wheel#/}" \
            "$app" --install-only
          python scripts/smoke_civex.py \
            "$home/bin/civex$([ "$RUNNER_OS" = Windows ] && echo .exe)" \
            --expect-version "${{ needs.build.outputs.version }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C app-dist civex

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname civex -srcfolder app-dist/civex.app -ov -format UDZO ${{ matrix.asset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path app-dist\civex.exe -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [build, test, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wheel
          path: dist

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # This repository is private. Sigstore attestations are logged in a
          # public transparency log and would name it, so opt out explicitly.
          attestations: false
          packages-dir: dist/
          skip-existing: true

      # After PyPI, so a release page never offers a version pip can't get.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            desktop/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

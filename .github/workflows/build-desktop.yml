name: Build Desktop

on:
  push:
    tags:
      - "v*"          # trigger on version tags, e.g. v0.1.0
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  build:
    permissions:
      contents: write   # required to upload release assets

    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: civex-macos
            asset: civex-macos.dmg
          - os: windows-latest
            artifact: civex-windows
            asset: civex-windows.zip
          - os: ubuntu-latest
            artifact: civex-linux
            asset: civex-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: rm -rf node_modules && npm ci && npm run build

      - name: Install Python dependencies
        run: pip install ".[postgres,workflows,server,desktop]" pyinstaller

      - name: Build executables
        run: pyinstaller civex.spec

      # ── macOS: wrap in a DMG ──────────────────────────────────────────────
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -r dist/civex-desktop staging/
          cp dist/civex staging/
          hdiutil create \
            -volname "civex" \
            -srcfolder staging \
            -ov -format UDZO \
            civex-macos.dmg

      # ── Windows: zip both executables ─────────────────────────────────────
      - name: Package ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\civex-desktop.exe,dist\civex.exe -DestinationPath civex-windows.zip

      # ── Linux: zip both binaries ──────────────────────────────────────────
      - name: Package ZIP (Linux)
        if: runner.os == 'Linux'
        run: zip civex-linux.zip dist/civex-desktop dist/civex

      # ── Upload artifact (all runs) ────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

      # ── Attach to GitHub Release (tag pushes only) ────────────────────────
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}

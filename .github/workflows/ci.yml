name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "civex-plugin-sdk/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks
        run: gitleaks git --redact -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ civex-plugin-sdk/src/

      - name: Ruff format check
        run: uv run ruff format --check src/

      - name: Mypy
        run: uv run mypy src/civex civex-plugin-sdk/src/civex_plugin_sdk

  test:
    # Sharded by recorded durations (.test_durations, pytest-split); each shard
    # also runs xdist across its runner's cores.
    name: test (${{ matrix.group }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      # Coverage nearly triples the suite's time, so a pull request runs the
      # tests alone; every push to main records coverage per shard and the
      # `coverage` job combines it and applies the fail_under floor.
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: uv run --with pytest-split==0.11.0 pytest tests/ -q -n auto --splits 6 --group ${{ matrix.group }} --durations=15

      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: uv run --with pytest-split==0.11.0 pytest tests/ -q -n auto --splits 6 --group ${{ matrix.group }} --cov=civex --cov-fail-under=0 --durations=15
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}

      - name: Run SDK tests
        if: matrix.group == 1
        run: uv run pytest civex-plugin-sdk/tests -q

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: coverage-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          include-hidden-files: true

  test-gate:
    # Keeps a single check named `test` for branch protection, whatever the
    # shard count.
    name: test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"

  coverage:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Installed (editable) so `source = ["civex"]` finds the package and
      # counts files no shard imported, exactly as the unsharded run did.
      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage and enforce the fail_under floor
        run: |
          uv run coverage combine .coverage.*
          uv run coverage report --show-missing

  postgres:
    # An authority on PostgreSQL: the migrations' PostgreSQL parts, settling
    # under its locking, the random sync scenarios, and copying a database
    # to and from it. The same tests skip without CIVEX_TEST_POSTGRES_URL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civex
          POSTGRES_PASSWORD: civex
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVEX_TEST_POSTGRES_URL: postgresql+psycopg2://civex:civex@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - name: Run the PostgreSQL tests
        run: uv run pytest tests/sync/test_postgres_authority.py tests/db -q -n 2 --dist loadgroup

      - name: Run the bulk restore tests on psycopg 2
        run: uv run pytest tests/services/test_restore_bulk_postgres.py tests/services/test_restore_core_postgres.py -q

      - name: Run the bulk restore tests on psycopg 3
        # civex prefers psycopg 3 when it is installed (`detect_pg_driver`), and
        # the bulk history writer is COPY, which each driver spells its own way.
        env:
          CIVEX_TEST_POSTGRES_URL: postgresql+psycopg://civex:civex@localhost:5432/postgres
        run: uv run --with "psycopg[binary]>=3.1" pytest tests/services/test_restore_bulk_postgres.py tests/services/test_restore_core_postgres.py -q

  sdk-sync:
    # civex and civex-plugin-sdk release separately; these keep them in step.
    # See docs/contributing/sdk-release.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: SDK/civex consistency (range, changelog, version bump)
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="--base origin/${{ github.base_ref }}"
          fi
          uv run --no-project --with packaging python scripts/check_sdk_sync.py check $BASE

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - name: pip-audit
        run: uv run pip-audit

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Check for Alembic migration drift
        run: |
          DBFILE=$(mktemp -u --suffix=.db)
          uv run alembic -x db_url="sqlite:///$DBFILE" upgrade head
          uv run alembic -x db_url="sqlite:///$DBFILE" check

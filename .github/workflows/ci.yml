name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "civex-plugin-sdk/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks
        run: gitleaks git --redact -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ civex-plugin-sdk/src/

      - name: Ruff format check
        run: uv run ruff format --check src/

      - name: Mypy
        run: uv run mypy src/civex civex-plugin-sdk/src/civex_plugin_sdk

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q -n auto --cov=civex --cov-report=term-missing

      - name: Run SDK tests
        run: uv run pytest civex-plugin-sdk/tests -q

  sdk-sync:
    # civex and civex-plugin-sdk release separately; these keep them in step.
    # See docs/contributing/sdk-release.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: SDK/civex consistency (range, changelog, version bump)
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="--base origin/${{ github.base_ref }}"
          fi
          uv run --no-project --with packaging python scripts/check_sdk_sync.py check $BASE

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install with dev extras
        run: uv sync --extra server --extra workflows --extra dev

      - name: pip-audit
        run: uv run pip-audit

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags version civex and civex-plugin-sdk

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Check for Alembic migration drift
        run: |
          DBFILE=$(mktemp -u --suffix=.db)
          uv run alembic -x db_url="sqlite:///$DBFILE" upgrade head
          uv run alembic -x db_url="sqlite:///$DBFILE" check

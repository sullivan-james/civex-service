name: bench-authority

# The authority applying a pushed batch of records on PostgreSQL with a large
# repository behind it (benchmarks/bench_bulk_push.py), before and after this
# branch: the base's source is run with this branch's benchmark. Run by hand.
on:
  # Runs on its own PR (and any PR touching the authority or the benchmark),
  # since a dispatch-only workflow can't run until it is on the default branch.
  pull_request:
    paths:
      - .github/workflows/bench-authority.yml
      - benchmarks/bench_bulk_push.py
      - src/civex/services/sync_authority.py
      - src/civex/repositories/local/sync_repo.py
  workflow_dispatch:
    inputs:
      base:
        description: Branch (or commit) to compare against
        default: agent/upload-speed
      prefill:
        description: Records (and audit_log, sync_ops rows) already held
        default: "200000"
      batches:
        description: Pushes of 250 records
        default: "8"

env:
  BENCH_BASE: ${{ inputs.base || github.base_ref }}
  BENCH_PREFILL: ${{ inputs.prefill || '200000' }}
  BENCH_BATCHES: ${{ inputs.batches || '8' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civex
          POSTGRES_PASSWORD: civex
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg2://civex:civex@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra server --extra workflows --extra dev

      - name: The base's source
        run: |
          mkdir /tmp/base
          git archive "origin/${BENCH_BASE}" src | tar -x -C /tmp/base

      - name: Before (the base)
        run: |
          PYTHONPATH=/tmp/base/src:$PWD/benchmarks uv run python benchmarks/bench_bulk_push.py \
            --prefill "${BENCH_PREFILL}" --batches "${BENCH_BATCHES}" | tee /tmp/before.txt

      - name: After (this branch)
        run: |
          PYTHONPATH=$PWD/src:$PWD/benchmarks uv run python benchmarks/bench_bulk_push.py \
            --prefill "${BENCH_PREFILL}" --batches "${BENCH_BATCHES}" | tee /tmp/after.txt

      - name: Deleted creates, before (the base)
        run: |
          PYTHONPATH=/tmp/base/src:$PWD/benchmarks uv run python benchmarks/bench_bulk_push.py \
            --prefill "${BENCH_PREFILL}" --batches "${BENCH_BATCHES}" --deleted 65 | tee /tmp/before-deleted.txt

      - name: Deleted creates, after (this branch)
        run: |
          PYTHONPATH=$PWD/src:$PWD/benchmarks uv run python benchmarks/bench_bulk_push.py \
            --prefill "${BENCH_PREFILL}" --batches "${BENCH_BATCHES}" --deleted 65 | tee /tmp/after-deleted.txt

      - name: Summary
        run: |
          {
            echo "## Authority push, ${BENCH_PREFILL} records held, ${BENCH_BATCHES} x 250 pushed"
            echo "Base: ${BENCH_BASE}"
            echo '### Before'; echo '```'; cat /tmp/before.txt; echo '```'
            echo '### After'; echo '```'; cat /tmp/after.txt; echo '```'
            echo '### Before, 65% of the records deleted before the first upload'; echo '```'; cat /tmp/before-deleted.txt; echo '```'
            echo '### After, 65% deleted'; echo '```'; cat /tmp/after-deleted.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

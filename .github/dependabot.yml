version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-plugin-react-hooks/-react/-import/-jsx-a11y all cap their peer
      # range at eslint ^9.0.0 as of March 2026 (react issue #35758 unconfirmed),
      # and eslint-plugin-react crashes on 10 (jsx-eslint/eslint-plugin-react#3977).
      # Revisit once those plugins declare eslint 10 support. (CIVEX-65)
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # typescript-eslint's peer range is ">=4.8.4 <6.1.0", so TS 7.x fails
      # at npm install; forcing it just moves the crash to lint time
      # (typescript-estree throws on `Cjs`, see typescript-eslint#12518,
      # closed not-planned). Staying on the 5.x line for now rather than
      # taking the 6.0.3 intermediate bump — revisit once TypeScript 7.1
      # ships and typescript-eslint widens its peer range (CIVEX-66).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(ci)"

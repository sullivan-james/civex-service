[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "civex-plugin-sdk"
# No version here: it comes from the newest `sdk-v*` git tag (see
# [tool.setuptools_scm] below and docs/contributing/sdk-release.md), so it can
# never disagree with what was tagged and published.
dynamic = ["version"]
description = "SDK for authoring out-of-process Civex workflow plugins (subprocess/container tiers)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "James Sullivan", email = "sullivanj041@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# A `table`-typed IOSpec value is handed to author code as a pandas
# DataFrame (civex_plugin_sdk.io_convert) -- an extra rather than a hard
# dependency because a plugin declaring no `table` input/output has no
# reason to pay for it, and io_convert degrades to plain records without it.
# A plugin that does declare one asks for it by name in its own PEP 723
# header: dependencies = ["civex-plugin-sdk[table]"].
table = ["pandas>=2.0"]

[project.urls]
Documentation = "https://civexdata.github.io/civex-docs/extending/sdk-reference.html"

[tool.setuptools_scm]
# The SDK lives in a subdirectory of the civex repo, so the git root is one up.
root = ".."
# Only `sdk-v*` tags version the SDK; civex's own `v*` tags are a separate
# namespace (and civex's config, in the root pyproject.toml, ignores these).
tag_regex = "^sdk-v(?P<version>\\d+(?:\\.\\d+)*(?:[.-]?(?:a|b|rc|post|dev)\\d+)*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "sdk-v[0-9]*"]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

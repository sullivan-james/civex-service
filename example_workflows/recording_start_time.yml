name: Extract recording start time from filename
description: >
  When a Recording record is saved with a file in the "Recording file" field,
  extract the datetime stamp from the filename (e.g. 20210218-075000) and
  write it to the "Start time" field as a UTC ISO datetime.

triggers:
  record_updated:
    schema: Recording
    fields:
      - Recording file

steps:
  - id: extract_dt
    plugin: civex.extract_from_filename
    config:
      field: Recording file
      pattern: '(\d{8}[-_]\d{6})'
      output_type: datetime
      date_format: 'YYYYMMDD[-_]HHmmSS'

  - id: save_dt
    plugin: civex.save_field
    config:
      field: Start time
    inputs:
      value: extract_dt.value

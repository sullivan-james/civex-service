services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: civexhub
      POSTGRES_USER: civexhub
      POSTGRES_PASSWORD: civexhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civexhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  hub:
    build:
      context: ..
      dockerfile: civex-hub/Dockerfile
    ports:
      - "8001:8001"
      - "2222:22"
    environment:
      CIVEXHUB_DATABASE_URL: postgresql://civexhub:civexhub@db/civexhub
      CIVEXHUB_OBJECT_STORE: filesystem
      CIVEXHUB_OBJECTS_DIR: /data/objects
      CIVEXHUB_SECRET_KEY: dev-secret-change-me
    volumes:
      - objects:/data/objects
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  objects:

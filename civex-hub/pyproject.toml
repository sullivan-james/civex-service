[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civexhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # civex must be installed first: pip install -e ../
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
civexhub = "civexhub.main:app"

[tool.setuptools.packages.find]
where = ["src"]
